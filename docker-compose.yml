version: '3.8'

services:
  teleterm-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teleterm-server
    restart: always
    ports:
      - "4000:4000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=4000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - TELETERM_USER_DATA_PATH=/app/data
    volumes:
      - ./data:/app/data
