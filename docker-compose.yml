version: '3.8'

services:
  teleterm-game:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teleterm-server
    restart: always
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - TELETERM_USER_DATA_PATH=/app/data
    volumes:
      - ./data:/app/data
