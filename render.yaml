services:
  - type: web
    name: teleterm-game
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/version
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: HOST
        value: 0.0.0.0
      - key: TELETERM_TRUSTED_PROXY
        value: cloudflare
